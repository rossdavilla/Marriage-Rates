<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Would You Be Married? · Pick a Year</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --blue:      #4b54e8;
      --blue-deep: #2a2f8f;
      --ink:       #1e1b4b;
      --coral:     #f4553d;
      --gold:      #ffc93c;
      --peri:      #e7e8fd;
      --peri-2:    #cdd1fb;
      --cream:     #fbf8f1;
      --muted:     #6a6790;
      --font-head: "Poppins", system-ui, sans-serif;
      --font-body: "Inter", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--cream);
      font-family: var(--font-body);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* The stage fills the embed iframe; internals are tuned for 720 x 450 */
    .stage {
      width: 100%; height: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 10px;
      padding: 12px 20px;
      text-align: center;
    }

    h1 {
      font-family: var(--font-head);
      font-weight: 800;
      font-size: 24px;
      margin: 0;
      letter-spacing: -0.01em;
    }

    /* ---- Year picker (3 buttons) ---- */
    .year-picker { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .year-btn {
      font-family: var(--font-head); font-weight: 700; font-size: 24px;
      padding: 9px 26px; border-radius: 999px; cursor: pointer;
      border: 2px solid var(--peri-2); background: #fff; color: var(--ink);
      transition: transform .08s ease, box-shadow .08s ease, background .15s ease, color .15s ease, border-color .15s ease;
    }
    .year-btn:hover { transform: translateY(-1px); }
    .year-btn.active {
      background: var(--blue); color: #fff; border-color: var(--blue);
      box-shadow: 0 4px 0 var(--blue-deep);
    }

    /* ---- Odds bar ---- */
    .odds { width: 380px; max-width: 100%; }
    .odds-cap { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
    .odds-cap b { color: var(--ink); font-weight: 700; }
    .odds-bar {
      display: flex; height: 20px; border-radius: 999px; overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(30,27,75,0.08);
    }
    .odds-bar span {
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 11px; color: #fff; white-space: nowrap;
      transition: width .35s ease;
    }
    #barMarried { background: var(--coral); }
    #barSingle  { background: var(--peri-2); color: var(--ink); }

    /* ---- Reel ---- */
    .reel-viewport {
      position: relative; width: 100%; overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(180deg, var(--peri) 0%, #fff 100%);
      border: 1px solid rgba(30,27,75,0.08);
      padding: 10px 0;
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%);
      mask-image: linear-gradient(90deg, transparent 0, #000 12%, #000 88%, transparent 100%);
    }
    .reel-strip { display: flex; gap: 10px; will-change: transform; transform: translateX(0); }
    .reel-card {
      flex: 0 0 auto; width: 84px; height: 104px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; position: relative;
      box-shadow: 0 2px 5px rgba(30,27,75,0.10);
    }
    .reel-card.type-married { background: #ffffff; border: 2px solid #ffe3a0; }
    .reel-card.type-single  { background: #d9ddff; border: 2px solid #c2c8fb; }
    .reel-card img { width: 88%; height: 74%; object-fit: contain; }
    .reel-card .tag {
      position: absolute; bottom: 6px;
      font-family: var(--font-head); font-weight: 700; font-size: 9px;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 1px 8px; border-radius: 999px;
    }
    .reel-card.type-married .tag { background: var(--coral); color: #fff; }
    .reel-card.type-single  .tag { background: var(--blue);  color: #fff; }
    .reel-card.win { transform: scale(1.06); z-index: 3; }
    .reel-card.win.type-married { box-shadow: 0 0 0 3px var(--coral), 0 8px 18px rgba(244,85,61,0.35); }
    .reel-card.win.type-single  { box-shadow: 0 0 0 3px var(--blue),  0 8px 18px rgba(75,84,232,0.35); }

    .reel-marker {
      position: absolute; top: 6px; bottom: 6px; left: 50%;
      width: 96px; transform: translateX(-50%);
      border: 3px dashed rgba(30,27,75,0.28); border-radius: 14px;
      pointer-events: none; z-index: 2;
    }
    .reel-marker::before {
      content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
      border-left: 9px solid transparent; border-right: 9px solid transparent;
      border-top: 12px solid var(--ink);
    }

    /* ---- Spin button ---- */
    .btn {
      font-family: var(--font-head); font-weight: 700; font-size: 17px;
      padding: 10px 30px; border-radius: 999px; border: none;
      background: var(--blue); color: #fff; cursor: pointer;
      box-shadow: 0 5px 0 var(--blue-deep);
      transition: transform .08s ease, box-shadow .08s ease;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--blue-deep); }
    .btn:disabled { opacity: .55; box-shadow: 0 5px 0 var(--blue-deep); transform: none; cursor: default; }

    /* ---- Result + tally (fixed height so layout never jumps) ---- */
    .result-area { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
    .verdict {
      font-family: var(--font-head); font-weight: 800; font-size: 20px;
      opacity: 0; transform: translateY(4px); transition: opacity .3s ease, transform .3s ease;
    }
    .verdict.show { opacity: 1; transform: none; }
    .verdict.married { color: var(--coral); }
    .verdict.single  { color: var(--blue); }
    .tally { font-size: 12px; color: var(--muted); min-height: 15px; }
    .tally b { color: var(--ink); }

    @media (prefers-reduced-motion: reduce) {
      .reel-strip { transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="stage">
    <h1>Would you be married?</h1>

    <div class="year-picker" id="yearPicker">
      <button class="year-btn active" data-year="1975">1975</button>
      <button class="year-btn" data-year="1995">1995</button>
      <button class="year-btn" data-year="2025">2025</button>
    </div>

    <div class="odds">
      <div class="odds-cap">
        In <b id="probYear">1975</b>, <b id="probMarried">78</b> of every 100 people aged 25–34 were married.
      </div>
      <div class="odds-bar">
        <span id="barMarried" style="width:78%">78%</span>
        <span id="barSingle"  style="width:22%">22%</span>
      </div>
    </div>

    <div class="reel-viewport" id="reelViewport">
      <div class="reel-marker"></div>
      <div class="reel-strip" id="reelStrip"></div>
    </div>

    <button class="btn" id="spinBtn">Spin</button>

    <div class="result-area">
      <div class="verdict" id="verdict"></div>
      <div class="tally" id="tally"></div>
    </div>
  </div>

  <script>
    // ---------- Data (share married, ages 25–34, per 100) ----------
    const MIN_YEAR = 1970, MAX_YEAR = 2025;
    const YEAR_POINTS = [
      { year: 1970, count: 86 },
      { year: 1980, count: 69 },
      { year: 1990, count: 60 },
      { year: 2000, count: 44 },
      { year: 2010, count: 35 },
      { year: 2020, count: 34 },
      { year: 2025, count: 34 }
    ];

    function marriedCountForYear(year) {
      if (year <= YEAR_POINTS[0].year) return YEAR_POINTS[0].count;
      const last = YEAR_POINTS[YEAR_POINTS.length - 1];
      if (year >= last.year) return last.count;
      for (let i = 0; i < YEAR_POINTS.length - 1; i++) {
        const a = YEAR_POINTS[i], b = YEAR_POINTS[i + 1];
        if (year >= a.year && year <= b.year) {
          const t = (year - a.year) / (b.year - a.year);
          return Math.round(a.count + t * (b.count - a.count));
        }
      }
      return last.count;
    }

    // ---------- Elements ----------
    const yearBtns    = document.querySelectorAll(".year-btn");
    const probYear    = document.getElementById("probYear");
    const probMarried = document.getElementById("probMarried");
    const barMarried  = document.getElementById("barMarried");
    const barSingle   = document.getElementById("barSingle");

    const START_YEAR = 1975;
    let currentYear = START_YEAR;

    // ---------- Year handling ----------
    function setYear(year) {
      currentYear = year;
      const m = marriedCountForYear(year);
      const s = 100 - m;

      probYear.textContent = year;
      probMarried.textContent = m;

      barMarried.style.width = m + "%";
      barMarried.textContent = m + "%";
      barSingle.style.width = s + "%";
      barSingle.textContent = s + "%";

      yearBtns.forEach(b => b.classList.toggle("active", parseInt(b.dataset.year, 10) === year));

      resetTally();
      if (typeof spinning !== "undefined" && !spinning) {
        buildReel(null);
        reelStrip.style.transform = `translateX(${centerOffsetFor(LAND_INDEX)}px)`;
      }
    }

    yearBtns.forEach(b =>
      b.addEventListener("click", () => setYear(parseInt(b.dataset.year, 10)))
    );

    // ================= SPINNER =================
    const COUPLE_IMGS = ["couple1.png","couple2.png","couple3.png","couple4.png","couple5.png"];
    const SINGLE_IMGS = ["single1.png","single2.png","single3.png","single4.png","single5.png",
                         "single6.png","single7.png","single8.png","single9.png","single10.png"];

    const reelViewport = document.getElementById("reelViewport");
    const reelStrip    = document.getElementById("reelStrip");
    const spinBtn      = document.getElementById("spinBtn");
    const verdictEl    = document.getElementById("verdict");
    const tallyEl      = document.getElementById("tally");

    const GAP = 10;
    const REEL_LEN = 48;
    const LAND_INDEX = 42;
    const prefersReduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    let spinning = false;
    let tally = { spins: 0, married: 0 };

    const rand = arr => arr[Math.floor(Math.random() * arr.length)];

    function makeCard(type) {
      const card = document.createElement("div");
      card.className = "reel-card type-" + type;
      const img = document.createElement("img");
      img.src = "img/" + (type === "married" ? rand(COUPLE_IMGS) : rand(SINGLE_IMGS));
      img.alt = "";
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = type === "married" ? "Married" : "Single";
      card.appendChild(img);
      card.appendChild(tag);
      return card;
    }

    function buildReel(finalType) {
      reelStrip.innerHTML = "";
      const marriedProb = marriedCountForYear(currentYear) / 100;
      for (let i = 0; i < REEL_LEN; i++) {
        let type;
        if (i === LAND_INDEX && finalType) type = finalType;
        else type = Math.random() < marriedProb ? "married" : "single";
        reelStrip.appendChild(makeCard(type));
      }
    }

    function stepWidth() {
      const card = reelStrip.querySelector(".reel-card");
      return card ? card.offsetWidth + GAP : 84 + GAP;
    }

    function centerOffsetFor(index) {
      const step = stepWidth();
      const cardW = step - GAP;
      const cardCenter = index * step + cardW / 2;
      return reelViewport.clientWidth / 2 - cardCenter;
    }

    function clearWin() {
      const w = reelStrip.querySelector(".reel-card.win");
      if (w) w.classList.remove("win");
    }

    function spin() {
      if (spinning) return;
      spinning = true;
      spinBtn.disabled = true;
      verdictEl.classList.remove("show");
      clearWin();

      const marriedProb = marriedCountForYear(currentYear) / 100;
      const outcome = Math.random() < marriedProb ? "married" : "single";

      buildReel(outcome);
      reelStrip.style.transition = "none";
      reelStrip.style.filter = "none";
      reelStrip.style.transform = "translateX(0px)";
      void reelStrip.offsetWidth;

      const target = centerOffsetFor(LAND_INDEX);

      if (prefersReduced) {
        reelStrip.style.transform = `translateX(${target}px)`;
        land(outcome);
        return;
      }
      animateTo(target, 2600, () => land(outcome));
    }

    function animateTo(target, duration, done) {
      const dist = target;
      const t0 = performance.now();
      let last = 0;
      function frame(now) {
        let p = (now - t0) / duration;
        if (p > 1) p = 1;
        const eased = 1 - Math.pow(1 - p, 4);
        const x = dist * eased;
        const v = Math.abs(x - last);
        last = x;
        const blur = Math.min(5, v * 0.06);
        reelStrip.style.filter = blur > 0.3 ? `blur(${blur}px)` : "none";
        reelStrip.style.transform = `translateX(${x}px)`;
        if (p < 1) requestAnimationFrame(frame);
        else { reelStrip.style.filter = "none"; done(); }
      }
      requestAnimationFrame(frame);
    }

    function land(outcome) {
      const winCard = reelStrip.children[LAND_INDEX];
      if (winCard) winCard.classList.add("win");

      verdictEl.className = "verdict show " + outcome;
      verdictEl.textContent = outcome === "married" ? "💍 You'd be married" : "☕ You'd be single";

      tally.spins++;
      if (outcome === "married") tally.married++;
      renderTally();

      spinning = false;
      spinBtn.disabled = false;
    }

    function renderTally() {
      if (tally.spins === 0) { tallyEl.innerHTML = ""; return; }
      const pct = Math.round((tally.married / tally.spins) * 100);
      tallyEl.innerHTML =
        `Across <b>${tally.spins}</b> spin${tally.spins > 1 ? "s" : ""} at ${currentYear}: ` +
        `<b>${tally.married}</b> married · <b>${tally.spins - tally.married}</b> single ` +
        `— that's <b>${pct}%</b> married.`;
    }

    function resetTally() {
      tally = { spins: 0, married: 0 };
      renderTally();
      verdictEl.classList.remove("show");
      clearWin();
    }

    spinBtn.addEventListener("click", spin);

    // ---------- Init ----------
    buildReel(null);
    reelStrip.style.transform = `translateX(${centerOffsetFor(LAND_INDEX)}px)`;
    setYear(START_YEAR);

    window.addEventListener("resize", () => {
      if (!spinning) reelStrip.style.transform = `translateX(${centerOffsetFor(LAND_INDEX)}px)`;
    });
  </script>
</body>
</html>
